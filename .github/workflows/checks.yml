# The checks to run before a PR is merged (#506): the Python tests with
# coverage, the PHP tests (#515), ruff, and the pre-commit hooks (ruff,
# ESLint, php -l, PHPStan).
name: Checks

on:
  pull_request:
    branches: [master, dev, '2.17']
  push:
    branches: [master, dev, '2.17']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the installer accepts, and the newest it meets
        # on supported distributions (Debian trixie)
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the requirements
        run: pip install -r requirements-dev.txt

      # For the XBT parser tests (#513), which are skipped without it; the
      # commit the parser's docstring gives, and --no-deps as there (the
      # parser doesn't need its netCDF4 and xarray)
      - name: Install xbt-edf-qc
        run: >-
          pip install --no-deps
          "xbt-edf-qc @ git+https://github.com/botheredbybees/xbt-edf-qc.git@a784145a2dc9462d8071747b5dfcfcfd2c3fee70"
          global-land-mask

      # Fails below .coveragerc's fail_under
      - name: Run the tests with coverage
        run: python -m pytest --cov --cov-report=term-missing:skip-covered

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # PHP 8.3 matches production; mbstring is needed by league/commonmark
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          tools: composer
          coverage: none

      # PHPUnit is a dev dependency (#515). --no-scripts skips
      # post_composer.sh, which installs web assets the tests don't need
      - name: Install PHPUnit
        working-directory: www
        run: composer install --no-interaction --no-progress --no-scripts

      - name: PHPUnit
        working-directory: www
        run: vendor/bin/phpunit

  lint:
    name: ruff, ESLint, php -l, PHPStan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # No npm cache: nothing here installs from www/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      # PHP 8.3 matches production; mbstring is needed by league/commonmark
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          tools: composer
          coverage: none

      # PHPStan is a dev dependency. --no-scripts skips post_composer.sh,
      # which installs web assets the checks don't need
      - name: Install PHPStan
        working-directory: www
        run: composer install --no-interaction --no-progress --no-scripts

      - name: Install ruff and pre-commit
        run: pip install "$(grep -i '^ruff==' requirements.txt)" "$(grep -i '^pre_commit==' requirements.txt)"

      - name: ruff (including the .py.dist templates)
        run: ruff check server/

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
